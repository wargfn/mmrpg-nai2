[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvel-mcp-narrator"
version = "0.1.4"
description = "Open WebUI-backed and deterministic copilot tools for Marvel Multiverse RPG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "wargfn" }
]
dependencies = [
  "discord.py==2.7.1",
  "fastmcp==4.0.5",
  "httpx==0.28.1"
]

[project.scripts]
marvel-narrator-cli = "marvel_mcp_narrator.interfaces.cli:main"
marvel-narrator-discord = "marvel_mcp_narrator.interfaces.discord_bot:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["marvel_mcp_narrator*"]

[tool.setuptools.package-data]
"marvel_mcp_narrator.data" = ["rules.json"]
